version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=./model_files
      - DEVICE=cpu
      - DATABASE_URL=sqlite:///./codeauth.db
    volumes:
      - ./backend:/app
      - backend_db:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_db:
